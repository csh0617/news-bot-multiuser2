<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Code · Generative Art Slide</title>
<style>
  :root{
    --bg:#03000a;
    --ink:#f3faff;
    --muted:#7de3ff;
    --accent:#b026ff;   /* 네온 퍼플 */
    --accent2:#0ff0fc;  /* 네온 시안 */
    --accent3:#ff2e97;  /* 네온 핑크 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Pretendard","Segoe UI",system-ui,-apple-system,sans-serif}

  /* 16:9 무대: 화면에 꽉 차게 스케일 */
  .stage-wrap{
    position:fixed;inset:0;display:grid;place-items:center;background:#000;
  }
  .stage{
    position:relative;
    width:100vw;height:56.25vw;      /* 16:9 */
    max-height:100vh;max-width:177.78vh;
    background:radial-gradient(120% 120% at 50% 0%, #1a0a3a 0%, var(--bg) 55%, #010004 100%);
    overflow:hidden;
    box-shadow:0 40px 120px rgba(0,0,0,.6);
  }

  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 은은한 격자/비네트 오버레이 */
  .grid{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(123,92,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
    background-size:min(4vw,64px) min(4vw,64px);
    mask:radial-gradient(120% 80% at 50% 40%,#000 55%,transparent 100%);
  }
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(0,0,0,.7) 100%)}

  /* 텍스트 콘텐츠 */
  .content{
    position:absolute;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 clamp(24px,6vw,110px);
  }
  .kicker{
    display:inline-flex;align-items:center;gap:.6em;
    width:max-content;
    font-size:clamp(10px,1.15vw,18px);letter-spacing:.42em;text-transform:uppercase;
    color:var(--accent2);font-weight:600;
    padding:.55em 1.1em;border:1px solid rgba(34,211,238,.35);border-radius:999px;
    background:rgba(34,211,238,.06);backdrop-filter:blur(4px);
    opacity:0;transform:translateY(18px);animation:rise .9s .2s forwards cubic-bezier(.2,.8,.2,1);
  }
  .kicker .dot{width:.5em;height:.5em;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 12px var(--accent2);animation:pulse 1.6s infinite}
  h1{
    margin-top:.5em;
    font-size:clamp(34px,7.4vw,124px);line-height:.98;font-weight:800;letter-spacing:-.02em;
    color:var(--ink);
    text-shadow:0 2px 40px rgba(123,92,255,.35);
  }
  h1 .line{display:block;overflow:hidden}
  h1 .line span{display:inline-block;transform:translateY(110%);
    animation:rise 1s forwards cubic-bezier(.16,1,.3,1)}
  h1 .line:nth-child(1) span{animation-delay:.35s}
  h1 .line:nth-child(2) span{animation-delay:.5s}
  .grad{
    background:linear-gradient(100deg,var(--accent) 0%,var(--accent3) 45%,var(--accent2) 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 6s linear infinite,rise 1s .5s forwards cubic-bezier(.16,1,.3,1);
  }
  p.sub{
    margin-top:1.1em;max-width:36ch;
    font-size:clamp(13px,1.65vw,24px);line-height:1.55;color:var(--muted);
    opacity:0;transform:translateY(18px);animation:rise 1s .85s forwards cubic-bezier(.2,.8,.2,1);
  }
  .tags{margin-top:1.6em;display:flex;flex-wrap:wrap;gap:.6em;
    opacity:0;transform:translateY(18px);animation:rise 1s 1.05s forwards cubic-bezier(.2,.8,.2,1)}
  .tags b{font-weight:600;font-size:clamp(10px,1.1vw,15px);color:#c9cffb;
    padding:.5em .95em;border-radius:8px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04)}
  .tags b i{font-style:normal;color:var(--accent)}

  /* 우하단 라이브 코드/신호 */
  .hud{
    position:absolute;right:clamp(20px,3vw,54px);bottom:clamp(18px,3vw,48px);
    text-align:right;pointer-events:none;font-family:"SF Mono",ui-monospace,Menlo,monospace;
    opacity:0;animation:fade 1s 1.3s forwards;
  }
  .hud .fps{font-size:clamp(28px,4vw,64px);font-weight:700;color:var(--ink);letter-spacing:-.02em;
    text-shadow:0 0 24px rgba(34,211,238,.4)}
  .hud .fps small{font-size:.34em;color:var(--muted);letter-spacing:.2em;margin-left:.4em}
  .hud .code{margin-top:.3em;font-size:clamp(9px,1vw,13px);color:var(--muted)}
  .hud .code b{color:var(--accent2);font-weight:600}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes fade{to{opacity:1}}
  @keyframes shine{to{background-position:200% center}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="grid"></div>
    <div class="vignette"></div>

    <div class="content">
      <span class="kicker"><span class="dot"></span>Generative · Real-time · Canvas</span>
      <h1>
        <span class="line"><span>코드가 살아</span></span>
        <span class="line"><span class="grad">움직이는 순간</span></span>
      </h1>
      <p class="sub">삼각함수 · 파티클 물리 · 색상 보간 — 단 한 장의 HTML이 매 프레임 새로 그려집니다.</p>
      <div class="tags">
        <b><i>sin</i>·cos 궤도</b>
        <b><i>lerp</i> 색상 보간</b>
        <b><i>requestAnimationFrame</i></b>
        <b><i>vector</i> 파티클</b>
      </div>
    </div>

    <div class="hud">
      <div class="fps"><span id="fps">60</span><small>FPS</small></div>
      <div class="code">particles <b id="pcount">0</b> · frame <b id="frame">0</b></div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  const stage=document.getElementById('stage');
  const fpsEl=document.getElementById('fps');
  const pcountEl=document.getElementById('pcount');
  const frameEl=document.getElementById('frame');

  let W,H,DPR;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    const r=stage.getBoundingClientRect();
    W=r.width;H=r.height;
    canvas.width=W*DPR;canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);resize();

  // ---- 색상 보간 유틸 (lerp) ----
  const palette=[[176,38,255],[255,46,151],[15,240,252],[57,255,20]]; // 네온: 퍼플·핑크·시안·라임
  function lerp(a,b,t){return a+(b-a)*t;}
  function pick(t){ // t:0..1 → 팔레트 순환 색
    t=(t%1+1)%1;
    const n=palette.length, s=t*n, i=Math.floor(s), f=s-i;
    const c1=palette[i%n], c2=palette[(i+1)%n];
    return [lerp(c1[0],c2[0],f),lerp(c1[1],c2[1],f),lerp(c1[2],c2[2],f)];
  }

  // ---- 파티클 (벡터 물리 + sin/cos 궤도) ----
  const N=180;
  const P=[];
  function seed(){
    P.length=0;
    for(let i=0;i<N;i++){
      P.push({
        a:Math.random()*Math.PI*2,        // 각도
        r:40+Math.random()* (Math.min(W,H)*0.42), // 반지름
        sp:0.2+Math.random()*0.8,         // 회전 속도
        sz:0.6+Math.random()*2.4,
        ph:Math.random()*Math.PI*2,       // 위상
        hue:Math.random()
      });
    }
  }
  seed();
  pcountEl.textContent=N;

  const mouse={x:0.5,y:0.5,active:false};
  stage.addEventListener('pointermove',e=>{
    const r=stage.getBoundingClientRect();
    mouse.x=(e.clientX-r.left)/r.width;
    mouse.y=(e.clientY-r.top)/r.height;
    mouse.active=true;
  });
  stage.addEventListener('pointerleave',()=>mouse.active=false);

  let t=0,frame=0,last=performance.now(),fpsAcc=0,fpsN=0;

  function draw(now){
    const dt=Math.min((now-last)/1000,0.05);last=now;
    t+=dt; frame++;

    // 잔상: 완전 클리어 대신 반투명 덮기 → 트레일 효과
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(3,0,10,0.13)';
    ctx.fillRect(0,0,W,H);

    // 중심 (마우스 따라 부드럽게 이동)
    const cx=W*(0.5 + (mouse.active?(mouse.x-0.5):0)*0.25);
    const cy=H*(0.5 + (mouse.active?(mouse.y-0.5):0)*0.25);

    ctx.globalCompositeOperation='lighter';

    for(let i=0;i<N;i++){
      const p=P[i];
      p.a+=p.sp*dt*0.6;
      // 반지름을 sin으로 맥동시켜 유기적인 호흡감
      const breathe=1+0.18*Math.sin(t*1.1+p.ph);
      const rr=p.r*breathe;
      const x=cx+Math.cos(p.a)*rr;
      const y=cy+Math.sin(p.a*1.02)*rr*0.62; // 살짝 타원 궤도

      const col=pick(p.hue + t*0.03);
      const alpha=0.55+0.45*Math.sin(t*2+p.ph);

      // 글로우 점
      const rad=p.sz*(2.2+breathe);
      const g=ctx.createRadialGradient(x,y,0,x,y,rad*6);
      g.addColorStop(0,`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${alpha})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,rad*6,0,Math.PI*2);ctx.fill();

      p._x=x;p._y=y;p._c=col;
    }

    // 가까운 파티클 연결 (별자리 네트워크)
    ctx.lineWidth=0.8;
    const maxD=Math.min(W,H)*0.12;
    for(let i=0;i<N;i++){
      const a=P[i];
      for(let j=i+1;j<i+7 && j<N;j++){
        const b=P[j];
        const dx=a._x-b._x,dy=a._y-b._y;
        const d=Math.hypot(dx,dy);
        if(d<maxD){
          const o=(1-d/maxD)*0.5;
          ctx.strokeStyle=`rgba(${a._c[0]|0},${a._c[1]|0},${a._c[2]|0},${o})`;
          ctx.beginPath();ctx.moveTo(a._x,a._y);ctx.lineTo(b._x,b._y);ctx.stroke();
        }
      }
    }

    // 중앙 코어
    const core=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.16);
    const cc=pick(t*0.05);
    core.addColorStop(0,`rgba(${cc[0]|0},${cc[1]|0},${cc[2]|0},0.35)`);
    core.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=core;
    ctx.beginPath();ctx.arc(cx,cy,Math.min(W,H)*0.16,0,Math.PI*2);ctx.fill();

    // HUD 갱신
    fpsAcc+=1/Math.max(dt,1e-4);fpsN++;
    if(frame%15===0){fpsEl.textContent=Math.round(fpsAcc/fpsN);fpsAcc=0;fpsN=0;}
    frameEl.textContent=frame;

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  window.addEventListener('resize',()=>{resize();seed();});
})();
</script>
</body>
</html>
