<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 · Game of Life</title>
<style>
  :root{--ink:#f3faff;--muted:#8fd8ff;--p:#b026ff;--c:#0ff0fc;--k:#ff2e97;--l:#39ff14}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--ink);
    font-family:"Pretendard","Segoe UI",system-ui,sans-serif}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    overflow:hidden;background:#02030a;box-shadow:0 40px 120px rgba(0,0,0,.6)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(0,0,0,.66) 100%)}
  .info{position:absolute;left:clamp(20px,4vw,64px);top:clamp(18px,4vw,56px);pointer-events:none;max-width:62%}
  .idx{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:clamp(10px,1.1vw,15px);
    letter-spacing:.3em;color:var(--c)}
  .idx b{color:var(--ink)}
  h1{margin-top:.25em;font-size:clamp(30px,5.4vw,92px);font-weight:800;letter-spacing:-.02em;line-height:1;
    text-shadow:0 2px 30px rgba(176,38,255,.4)}
  h1 .g{background:linear-gradient(100deg,var(--p),var(--k) 50%,var(--c));background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  .desc{margin-top:.7em;font-size:clamp(12px,1.55vw,22px);line-height:1.5;color:var(--muted);max-width:32ch}
  .tags{margin-top:1.1em;display:flex;flex-wrap:wrap;gap:.5em}
  .tags b{font-weight:600;font-size:clamp(9px,1vw,14px);color:#d7f4ff;padding:.45em .85em;border-radius:7px;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
  .tags b i{font-style:normal;color:var(--c)}
  .hud{position:absolute;right:clamp(18px,3vw,48px);bottom:clamp(18px,3vw,48px);text-align:right;
    pointer-events:none;font-family:"SF Mono",ui-monospace,monospace;font-size:clamp(9px,1vw,13px);color:var(--muted)}
  .hud .fps{font-size:clamp(24px,3.4vw,52px);font-weight:700;color:var(--ink);
    text-shadow:0 0 20px rgba(15,240,252,.45)}
  .hud .fps small{font-size:.32em;letter-spacing:.2em;color:var(--muted);margin-left:.4em}
  @keyframes shine{to{background-position:200% center}}
</style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="info">
    <div class="idx"><b>06</b> / 06 &nbsp;·&nbsp; GAME OF LIFE</div>
    <h1>살아 숨쉬는 <span class="g">생명 격자</span></h1>
    <div class="desc">단 네 개의 규칙으로 세포가 태어나고 죽으며 패턴이 진화합니다.</div>
    <div class="tags"><b><i>cellular</i> 오토마타</b><b>Conway 규칙</b><b><i>age</i> glow</b></div>
  </div>
  <div class="hud"><div class="fps"><span id="fps">60</span><small>FPS</small></div></div>
</div></div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),fpsEl=document.getElementById('fps');
let W,H,DPR,cols,rows,cell,grid,age,acc;const NEON=['#b026ff','#0ff0fc','#ff2e97','#39ff14'];
function seed(){grid=new Uint8Array(cols*rows);age=new Float32Array(cols*rows);
  for(let i=0;i<grid.length;i++)grid[i]=Math.random()<0.28?1:0;}
function resize(){DPR=Math.min(devicePixelRatio||1,2);const r=stage.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  cell=Math.max(8,Math.round(W/100));cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);acc=0;seed();}
addEventListener('resize',resize);resize();
let last=performance.now(),fA=0,fN=0,fr=0;
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;acc+=dt;
  if(acc>0.09){acc=0;const ng=new Uint8Array(cols*rows);
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;
        const xx=(x+dx+cols)%cols,yy=(y+dy+rows)%rows;n+=grid[yy*cols+xx];}
      const i=y*cols+x;ng[i]=grid[i]?(n===2||n===3?1:0):(n===3?1:0);
      age[i]=ng[i]?Math.min(age[i]+1,20):0;}
    grid=ng;
    if(Math.random()<0.02){for(let k=0;k<cols*rows*0.02;k++)grid[(Math.random()*grid.length)|0]=1;}}
  ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x;if(!grid[i])continue;
    const a=age[i]/20,c=a<0.3?NEON[3]:a<0.7?NEON[1]:NEON[0];
    ctx.fillStyle=c;ctx.globalAlpha=.55+a*0.45;ctx.fillRect(x*cell,y*cell,cell-1.5,cell-1.5);}
  ctx.globalAlpha=1;
  fA+=1/Math.max(dt,1e-4);fN++;fr++;if(fr%15===0){fpsEl.textContent=Math.round(fA/fN);fA=0;fN=0;}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
