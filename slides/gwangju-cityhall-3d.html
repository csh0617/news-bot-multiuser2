<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광주광역시청 · Cinematic 3D</title>
<style>
  :root{--ink:#f4f8ff;--muted:#b9c6e4;--c:#7cc6ff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--ink);
    font-family:"Pretendard","Segoe UI",system-ui,sans-serif;user-select:none}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    overflow:hidden;background:#05070f;box-shadow:0 40px 120px rgba(0,0,0,.6);cursor:crosshair}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* 시네마틱 상하 그라데이션(레터박스 느낌) */
  .cine{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 16%,transparent 78%,rgba(0,0,0,.55))}
  .bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:1em;
    padding:clamp(16px,2.4vw,32px) clamp(20px,3vw,48px);pointer-events:none}
  .badge{font-family:"SF Mono",ui-monospace,monospace;font-size:clamp(8px,.95vw,12px);
    letter-spacing:.28em;color:var(--c);border:1px solid rgba(124,198,255,.4);border-radius:999px;
    padding:.5em 1em;background:rgba(124,198,255,.08);backdrop-filter:blur(4px);
    opacity:0;animation:fade 1.2s .3s forwards}
  .title{position:absolute;left:clamp(20px,3vw,52px);bottom:clamp(30px,5vw,68px);pointer-events:none}
  .title .en{font-family:"SF Mono",monospace;font-size:clamp(9px,1.1vw,15px);letter-spacing:.34em;
    color:var(--c);opacity:0;animation:fade 1.2s .9s forwards}
  .title .ko{font-size:clamp(34px,6.2vw,104px);font-weight:800;letter-spacing:-.02em;line-height:1;
    margin-top:.16em;text-shadow:0 4px 40px rgba(0,0,0,.6);
    opacity:0;transform:translateY(24px);animation:rise 1.3s .5s forwards cubic-bezier(.16,1,.3,1)}
  .title .sub{margin-top:.5em;font-size:clamp(11px,1.35vw,19px);color:var(--muted);
    opacity:0;animation:fade 1.2s 1.2s forwards}
  .hint{position:absolute;right:clamp(20px,3vw,48px);bottom:clamp(26px,4vw,52px);text-align:right;
    font-size:clamp(9px,1.05vw,14px);color:var(--muted);pointer-events:none;line-height:1.7;
    opacity:0;animation:fade 1.2s 1.5s forwards}
  .hint b{color:var(--ink);font-weight:600}
  .fps{position:absolute;left:clamp(20px,3vw,48px);top:auto;bottom:clamp(20px,3vw,20px);display:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:#05070f;
    transition:opacity .8s;text-align:center}
  .loading.hide{opacity:0;pointer-events:none}
  .loading .ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--c);margin:0 auto 1em;animation:spin 1s linear infinite}
  .loading .msg{font-size:clamp(11px,1.3vw,16px);color:var(--muted);letter-spacing:.1em}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:none}}
</style>
</head>

<div class="wrap"><div class="stage" id="stage">

    <div class="ko">광주광역시청</div>

// 마우스 시차
const ms={x:0,y:0,tx:0,ty:0};
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();ms.tx=((e.clientX-r.left)/r.width-0.5)*2;ms.ty=((e.clientY-r.top)/r.height-0.5)*2;});
stage.addEventListener('pointerleave',()=>{ms.tx=0;ms.ty=0;});

function drawFS(p){gl.useProgram(p);bindFS(p);gl.drawArrays(gl.TRIANGLES,0,3);}
let t=0,last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;t+=dt;
  if(!ready){requestAnimationFrame(frame);return;}
  ms.x+=(ms.tx-ms.x)*0.05;ms.y+=(ms.ty-ms.y)*0.05;
  const sa=VW/VH, wide=sa>IMGA?1:0;
  const zoom=1.07+0.05*Math.sin(t*0.11);
  const pan=[Math.sin(t*0.06)*0.014, Math.cos(t*0.05)*0.010];
  const par=[Math.sin(t*0.23)*0.010 + ms.x*0.022, Math.cos(t*0.18)*0.007 + ms.y*0.016];

  // 씬(패럴랙스+그레이딩)
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneT.fbo);gl.viewport(0,0,VW,VH);
  gl.useProgram(sceneP);
  gl.uniform1f(sU.ia,IMGA/sa);gl.uniform1f(sU.sa,sa/IMGA);gl.uniform1f(sU.wide,wide);
  gl.uniform1f(sU.zoom,zoom);gl.uniform2f(sU.pan,pan[0],pan[1]);gl.uniform2f(sU.par,par[0],par[1]);gl.uniform1f(sU.time,t);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(sU.tex,0);
  bindFS(sceneP);gl.drawArrays(gl.TRIANGLES,0,3);

  // 블룸
  const hw=VW>>1,hh=VH>>1;
  gl.bindFramebuffer(gl.FRAMEBUFFER,brightT.fbo);gl.viewport(0,0,hw,hh);
  gl.useProgram(brightP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneT.tex);gl.uniform1i(brU.tex,0);gl.uniform1f(brU.th,0.42);bindFS(brightP);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER,blurT.fbo);gl.viewport(0,0,hw,hh);
  gl.useProgram(blurP);gl.bindTexture(gl.TEXTURE_2D,brightT.tex);gl.uniform1i(blU.tex,0);gl.uniform2f(blU.dir,1.3/hw,0);bindFS(blurP);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER,brightT.fbo);gl.viewport(0,0,hw,hh);
  gl.bindTexture(gl.TEXTURE_2D,blurT.tex);gl.uniform2f(blU.dir,0,1.3/hh);bindFS(blurP);gl.drawArrays(gl.TRIANGLES,0,3);

  // 합성 → 화면
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,VW,VH);
  gl.useProgram(compP);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneT.tex);gl.uniform1i(coU.scene,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,brightT.tex);gl.uniform1i(coU.bloom,1);
  gl.uniform1f(coU.strength,0.9);gl.uniform1f(coU.uTime,t);gl.uniform2f(coU.res,VW,VH);
  bindFS(compP);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.activeTexture(gl.TEXTURE0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
