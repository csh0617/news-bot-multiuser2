<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Street · Cinematic City Drive</title>
<style>
  :root{--ink:#f3faff;--muted:#9fb2d6;--c:#39d0ff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--ink);
    font-family:"Pretendard","Segoe UI",system-ui,sans-serif;user-select:none}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    overflow:hidden;background:#05070f;box-shadow:0 40px 120px rgba(0,0,0,.6);cursor:grab}
  .stage.drag{cursor:grabbing}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  .frameGrad{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 130% at 50% 45%,transparent 62%,rgba(0,0,0,.5) 100%)}
  .bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:1em;
    padding:clamp(14px,2vw,26px) clamp(18px,2.6vw,40px);pointer-events:none;
    background:linear-gradient(180deg,rgba(3,5,12,.7),transparent)}
  .badge{font-family:"SF Mono",ui-monospace,monospace;font-size:clamp(8px,.95vw,12px);
    letter-spacing:.22em;color:var(--c);border:1px solid rgba(57,208,255,.4);border-radius:999px;
    padding:.45em .9em;background:rgba(57,208,255,.08)}
  .place .t{font-size:clamp(15px,2vw,30px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .place .s{font-size:clamp(9px,1vw,13px);color:var(--muted);margin-top:.15em}
  .compass{margin-left:auto;display:flex;align-items:center;gap:.6em;font-family:"SF Mono",monospace;
    font-size:clamp(10px,1.2vw,16px);pointer-events:none}
  .compass .dir{width:2.4em;text-align:center;font-weight:800;color:var(--c)}
  .compass .deg{color:var(--muted);font-size:.8em}
  .hint{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,1.6vw,26px);padding:clamp(12px,1.8vw,24px);pointer-events:none;
    background:linear-gradient(0deg,rgba(3,5,12,.7),transparent);
    font-size:clamp(9px,1.05vw,14px);color:var(--muted)}
  .hint b{color:var(--ink);font-weight:600}.hint .fps{font-family:"SF Mono",monospace;color:var(--c)}
  .loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:#05070f;
    transition:opacity .8s;text-align:center}
  .loading.hide{opacity:0;pointer-events:none}
  .loading .ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--c);margin:0 auto 1em;animation:spin 1s linear infinite}
  .loading .msg{font-size:clamp(11px,1.3vw,16px);color:var(--muted);letter-spacing:.1em}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="frameGrad"></div>
  <div class="bar">
    <span class="badge">3D · 시네마틱 · 합성 샘플</span>
    <div class="place"><div class="t">네온 시티 대로</div>
      <div class="s">다양한 건물 · 신호등 · 보행자 · 블룸 · 젖은 노면 · 순수 WebGL</div></div>
    <div class="compass"><span class="dir" id="dir">N</span><span class="deg" id="deg">0°</span></div>
  </div>
  <div class="hint">
    <span>🖱️ <b>드래그</b> 시선</span><span>🔍 <b>스크롤</b> 줌</span>
    <span>▶ <b>자동 주행</b></span><span class="fps"><span id="fps">60</span> FPS</span>
  </div>
  <div class="loading" id="loading"><div class="ring"></div><div class="msg">도시 생성 중…</div></div>
</div></div>

<script>
(function(){
const stage=document.getElementById('stage'),canvas=document.getElementById('gl'),loading=document.getElementById('loading');
const fpsEl=document.getElementById('fps'),dirEl=document.getElementById('dir'),degEl=document.getElementById('deg');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gl=canvas.getContext('webgl',{antialias:false,alpha:false})||canvas.getContext('experimental-webgl');
if(!gl){loading.querySelector('.msg').textContent='WebGL을 사용할 수 없습니다';return;}
const rng0=(function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})(20260725);
const rand=(a,b)=>a+(b-a)*rng0();
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}

/* ============================================================
   지오메트리: 다양한 건물 + 도로 + 신호등/안테나 기둥
   vertex: pos3 nor3 uv2 seed kind style  (11 float)
   kind 0벽 1지붕 2도로 3구조물(다크메탈)
   ============================================================ */
const L=130, roadW=6.0, sw=3.2, line=roadW+sw;
const V=[];
function quad(a,b,c,d,nx,ny,nz,cols,rows,seed,kind,style){
  const uv=[[0,0],[cols,0],[cols,rows],[0,rows]],q=[a,b,c,a,c,d],qi=[0,1,2,0,2,3];
  for(let i=0;i<6;i++){const p=q[i],u=uv[qi[i]];V.push(p[0],p[1],p[2],nx,ny,nz,u[0],u[1],seed,kind,style);}
}
function boxYY(x0,x1,z0,z1,y0,y1,seed,kind,style){
  const cx=x1-x0,cz=z1-z0,H=y1-y0;
  const cX=Math.max(2,Math.round(cx/4.4)),cZ=Math.max(2,Math.round(cz/4.4)),rw=Math.max(2,Math.round(H/4.0));
  quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], 0,0,1, cX,rw,seed,kind,style);
  quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], 0,0,-1,cX,rw,seed,kind,style);
  quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], 1,0,0, cZ,rw,seed,kind,style);
  quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], -1,0,0,cZ,rw,seed,kind,style);
  quad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], 0,1,0, 1,1,seed,1,style); // 지붕
}
const antennaPts=[]; // 옥상 점멸등 위치
const signalPts=[];  // 신호등 위치(사이클 색)
function emitBuilding(s,off){
  const x0=s.x0,x1=s.x1,z0=s.z0+off,z1=s.z1+off,seed=s.seed,style=s.style;
  const tiers=s.h>52?2:(s.h>30?1:0);
  const segH=s.h/(tiers+1);
  let y=0,cx0=x0,cx1=x1,cz0=z0,cz1=z1;
  for(let t=0;t<=tiers;t++){
    boxYY(cx0,cx1,cz0,cz1,y,y+segH,seed,0,style);
    y+=segH;
    const sxx=(cx1-cx0)*0.14,szz=(cz1-cz0)*0.14;
    cx0+=sxx;cx1-=sxx;cz0+=szz;cz1-=szz;
  }
  if(s.antenna){
    const mx=(x0+x1)/2,mz=(z0+z1)/2,at=s.h+rand(4,11);
    boxYY(mx-0.35,mx+0.35,mz-0.35,mz+0.35,s.h,at,seed,3,0);
    antennaPts.push([mx,at,mz]);
  }
}
// 스펙 생성(1주기)
const specs=[];
function stylePick(){const r=rng0();return r<0.45?0:r<0.68?1:r<0.85?2:3;}
for(const side of [-1,1]){
  let z=rand(0,7);
  while(z<L-6){const dz=rand(7,13),wx=rand(9,17),h=rand(12,44);
    const near=line+rand(0.2,1.4),x0=side>0?near:-(near+wx),x1=side>0?near+wx:-near;
    specs.push({x0,x1,z0:z,z1:z+dz,h,seed:rng0()*1000,style:stylePick(),antenna:h>34&&rng0()<0.5});
    z+=dz+rand(2,6);}
  let z2=rand(0,13);
  while(z2<L-8){const dz=rand(10,20),wx=rand(12,26),h=rand(30,86);
    const near=line+rand(19,30),x0=side>0?near:-(near+wx),x1=side>0?near+wx:-near;
    specs.push({x0,x1,z0:z2,z1:z2+dz,h,seed:rng0()*1000,style:stylePick(),antenna:h>44&&rng0()<0.6});
    z2+=dz+rand(4,10);}
}
for(const off of [0,L]) for(const s of specs) emitBuilding(s,off);

// 신호등 기둥(양쪽, 주기당 2개) + 라이트 위치
for(const base of [{z:L*0.32,side:1},{z:L*0.78,side:-1}]){
  for(const off of [0,L]){
    const px=base.side*(roadW+0.6),pz=base.z+off;
    boxYY(px-0.18,px+0.18,pz-0.18,pz+0.18,0,5.6,7,3,0);           // 기둥
    const armX0=Math.min(px,px-base.side*2.4),armX1=Math.max(px,px-base.side*2.4);
    boxYY(armX0,armX1,pz-0.16,pz+0.16,5.2,5.55,7,3,0);            // 가로암
    const hx=px-base.side*2.2;
    boxYY(hx-0.28,hx+0.28,pz-0.28,pz+0.28,4.3,5.25,7,3,0);        // 신호등 헤드
    signalPts.push({x:hx,y:4.78,z:pz,phase:base.z});
  }
}
// 도로/지면
quad([-260,0,-40],[260,0,-40],[260,0,2*L+40],[-260,0,2*L+40], 0,1,0, 1,1, 0,2,0);

const vArr=new Float32Array(V);
const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,vArr,gl.STATIC_DRAW);
const VCOUNT=vArr.length/11;

/* ============================================================
   셰이더: 도시
   ============================================================ */
const cityVS=`attribute vec3 aPos;attribute vec3 aNor;attribute vec2 aUV;attribute float aSeed;attribute float aKind;attribute float aStyle;
uniform mat4 uVP;
varying vec3 vN;varying vec2 vUV;varying float vSeed;varying float vKind;varying float vStyle;varying vec3 vW;
void main(){vN=aNor;vUV=aUV;vSeed=aSeed;vKind=aKind;vStyle=aStyle;vW=aPos;gl_Position=uVP*vec4(aPos,1.0);}`;
const cityFS=`precision highp float;
varying vec3 vN;varying vec2 vUV;varying float vSeed;varying float vKind;varying float vStyle;varying vec3 vW;
uniform vec3 uFog;uniform vec3 uLight;uniform vec3 uCam;uniform float uTime;
float h11(float n){return fract(sin(n)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  vec3 col;float d=distance(vW,uCam);
  if(vKind>2.5){ // 구조물(안테나/신호등 기둥)
    float diff=max(dot(normalize(vN),normalize(uLight)),0.0);
    col=vec3(0.06,0.065,0.08)*(0.5+0.7*diff);
  } else if(vKind>1.5){ // 도로/지면 (젖은 아스팔트)
    float ax=abs(vW.x),gz=vW.z,grain=(h2(floor(vW.xz*3.0))-0.5)*0.05;
    if(ax<6.0){col=vec3(0.09,0.10,0.13)+grain;
      if(ax<0.28){float m=mod(gz,7.0);if(m<4.2)col=vec3(0.85,0.68,0.24);}
      else if(abs(ax-5.6)<0.13)col=vec3(0.7,0.72,0.76);
      else if(abs(ax-3.0)<0.09){float m=mod(gz,5.0);if(m<2.4)col=vec3(0.62,0.64,0.68);}
    } else if(ax<6.4){col=vec3(0.22,0.24,0.29);}
    else if(ax<9.2){float t=mod(floor(ax*2.0)+floor(gz*2.0),2.0);col=vec3(0.16,0.17,0.21)+t*0.04+grain;}
    else{col=vec3(0.06,0.10,0.07)+grain;}
  } else if(vKind>0.5){ // 지붕
    col=vec3(0.07,0.08,0.11);float diff=max(dot(normalize(vN),normalize(uLight)),0.0);col*=(0.5+0.6*diff);
    if(h2(floor(vW.xz*0.6))>0.7)col+=vec3(0.02); // 옥상 잡물 느낌
  } else { // 벽 + 창문(스타일별)
    vec2 g=vUV;vec2 cell=floor(g);vec2 cc=fract(g)-0.5;
    float diff=max(dot(normalize(vN),normalize(uLight)),0.0);
    vec3 tint=mix(vec3(0.13,0.14,0.19),vec3(0.22,0.19,0.25),h11(vSeed*1.7));
    if(vStyle>2.5)tint=mix(vec3(0.10,0.13,0.20),vec3(0.12,0.18,0.26),h11(vSeed)); // 유리톤
    vec3 wall=tint*(0.40+0.7*diff);
    if(fract(g.y)<0.10)wall*=0.6;
    vec3 viewDir=normalize(uCam-vW);
    float graze=abs(dot(normalize(vN),viewDir));
    float foot=d/max(graze,0.12);
    float pw=clamp(foot*0.006,0.02,0.9);
    // 스타일별 창문 마스크
    float wmask;
    if(vStyle<0.5){ // 격자
      float hw=0.28;float wx=smoothstep(hw+pw,hw-pw,abs(cc.x)),wy=smoothstep(hw+pw,hw-pw,abs(cc.y));wmask=wx*wy;
    } else if(vStyle<1.5){ // 가로 리본
      float hw=0.30;wmask=smoothstep(hw+pw,hw-pw,abs(cc.y));
    } else if(vStyle<2.5){ // 세로 스트립
      float hw=0.24;wmask=smoothstep(hw+pw,hw-pw,abs(cc.x));
    } else { // 유리 커튼월
      float hw=0.40;float wx=smoothstep(hw+pw,hw-pw,abs(cc.x)),wy=smoothstep(hw+pw,hw-pw,abs(cc.y));wmask=wx*wy*0.85;
    }
    // 점등/깜빡임
    float baseR=h2(cell+vSeed);
    bool flick=h2(cell*1.7+vSeed+5.0)>0.82;
    float lit=flick?step(0.5,fract(sin(dot(cell,vec2(7.3,3.1))+vSeed)+uTime*0.6)):step(0.52,baseR);
    if(vStyle>2.5)lit=step(0.72,baseR); // 유리타워는 대부분 소등(반사)
    vec3 winCol;
    if(lit>0.5){float warm=h2(cell+vSeed+7.3);winCol=(warm>0.5?vec3(1.0,0.80,0.42):vec3(0.5,0.86,1.0))*1.15;}
    else{ // 소등 유리: 하늘/노을 반사
      float sky=clamp(vW.y*0.02+0.2,0.0,1.0);
      winCol=mix(vec3(0.05,0.07,0.13),vec3(0.35,0.22,0.28),sky)*(0.6+0.5*diff);
    }
    col=mix(wall,winCol,clamp(wmask,0.0,1.0));
    // 네온 간판
    if(h2(vec2(vSeed,7.0))>0.66){
      float row=1.0+floor(h2(vec2(vSeed,9.0))*3.0);
      if(abs(cell.y-row)<0.5){vec3 neon=0.55+0.45*cos(uTime*2.5+cell.x*0.6+vec3(0.0,2.1,4.2));
        col=mix(col,neon*1.25,smoothstep(0.5,0.32,abs(cc.y))*0.8);}
    }
    vec3 avg=wall*0.82+vec3(0.05,0.048,0.05);
    col=mix(col,avg,clamp((foot-24.0)/60.0,0.0,1.0));
  }
  col=mix(col,uFog,clamp((d-30.0)/105.0,0.0,1.0));
  gl_FragColor=vec4(col,1.0);
}`;
const city=prog(cityVS,cityFS);
const cA={pos:gl.getAttribLocation(city,'aPos'),nor:gl.getAttribLocation(city,'aNor'),uv:gl.getAttribLocation(city,'aUV'),seed:gl.getAttribLocation(city,'aSeed'),kind:gl.getAttribLocation(city,'aKind'),style:gl.getAttribLocation(city,'aStyle')};
const cU={vp:gl.getUniformLocation(city,'uVP'),cam:gl.getUniformLocation(city,'uCam'),fog:gl.getUniformLocation(city,'uFog'),light:gl.getUniformLocation(city,'uLight'),time:gl.getUniformLocation(city,'uTime')};

/* 하늘 */
const skyVS=`attribute vec2 p;varying vec2 uv;void main(){uv=p;gl_Position=vec4(p,0.0,1.0);}`;
const skyFS=`precision highp float;varying vec2 uv;
uniform vec3 fwd;uniform vec3 rgt;uniform vec3 up;uniform float tanH;uniform float aspect;uniform vec3 sun;
void main(){vec3 d=normalize(fwd+uv.x*tanH*aspect*rgt+uv.y*tanH*up);
  float t=clamp(d.y*1.3+0.15,0.0,1.0);
  vec3 hor=vec3(1.0,0.55,0.33),mid=vec3(0.12,0.17,0.40),zen=vec3(0.02,0.04,0.14);
  vec3 s=t<0.5?mix(hor,mid,t/0.5):mix(mid,zen,(t-0.5)/0.5);
  float su=max(dot(d,normalize(sun)),0.0);
  s+=vec3(1.0,0.72,0.4)*pow(su,90.0)*1.3;s+=vec3(1.0,0.55,0.28)*pow(su,7.0)*0.32;
  gl_FragColor=vec4(s,1.0);}`;
const sky=prog(skyVS,skyFS);
const fsBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,fsBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const sA=gl.getAttribLocation(sky,'p');
const sU={fwd:gl.getUniformLocation(sky,'fwd'),rgt:gl.getUniformLocation(sky,'rgt'),up:gl.getUniformLocation(sky,'up'),tanH:gl.getUniformLocation(sky,'tanH'),aspect:gl.getUniformLocation(sky,'aspect'),sun:gl.getUniformLocation(sky,'sun')};

/* 라이트(포인트, 가산) — 차량/신호등/안테나 + 젖은 노면 반사 */
const litVS=`attribute vec3 aPos;attribute vec3 aCol;attribute float aSize;
uniform mat4 uVP;varying vec3 vCol;
void main(){vCol=aCol;vec4 p=uVP*vec4(aPos,1.0);gl_Position=p;gl_PointSize=clamp(aSize/max(p.w,0.1),2.0,160.0);}`;
const litFS=`precision mediump float;varying vec3 vCol;
void main(){float r=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vCol*a,a);}`;
const litP=prog(litVS,litFS);
const lA={pos:gl.getAttribLocation(litP,'aPos'),col:gl.getAttribLocation(litP,'aCol'),size:gl.getAttribLocation(litP,'aSize')};
const lU={vp:gl.getUniformLocation(litP,'uVP')};
const litBuf=gl.createBuffer();

/* 보행자(빌보드 실루엣) */
const pedVS=`attribute vec3 aPos;attribute vec2 aLuv;
uniform mat4 uVP;uniform vec3 uCam;varying vec2 lv;varying float vFog;
void main(){lv=aLuv;vFog=clamp((distance(aPos,uCam)-30.0)/105.0,0.0,1.0);gl_Position=uVP*vec4(aPos,1.0);}`;
const pedFS=`precision mediump float;varying vec2 lv;varying float vFog;uniform vec3 uFog;
void main(){
  float x=lv.x,y=lv.y;float a=0.0;
  a=max(a,step(length(vec2(x,(y-0.86)*1.1)),0.13));           // 머리
  float body=step(abs(x),0.15-max(0.0,(y-0.7))*0.6)*step(0.0,y)*step(y,0.78);
  a=max(a,body);
  float legs=step(abs(abs(x)-0.07),0.045)*step(0.0,y)*step(y,0.28);a=max(a,legs);
  if(a<0.5)discard;
  vec3 col=vec3(0.03,0.03,0.05);              // 어두운 실루엣
  float rim=smoothstep(0.09,0.15,abs(x));      // 가장자리 림라이트
  col+=vec3(0.20,0.13,0.09)*rim*0.7;           // 따뜻한 외곽광
  col+=vec3(0.04,0.06,0.12)*step(0.7,y);       // 머리쪽 차가운 하이라이트
  col=mix(col,uFog,vFog*0.85);
  gl_FragColor=vec4(col,1.0);
}`;
const pedP=prog(pedVS,pedFS);
const pA={pos:gl.getAttribLocation(pedP,'aPos'),luv:gl.getAttribLocation(pedP,'aLuv')};
const pU={vp:gl.getUniformLocation(pedP,'uVP'),cam:gl.getUniformLocation(pedP,'uCam'),fog:gl.getUniformLocation(pedP,'uFog')};
const pedBuf=gl.createBuffer();

/* 블룸: 밝은부분 추출 + 블러 + 합성 */
const copyVS=skyVS;
const brightFS=`precision mediump float;varying vec2 uv;uniform sampler2D tex;uniform float th;
void main(){vec3 c=texture2D(tex,uv*0.5+0.5).rgb;float l=max(max(c.r,c.g),c.b);
  vec3 b=c*smoothstep(th,th+0.35,l);gl_FragColor=vec4(b,1.0);}`;
const blurFS=`precision mediump float;varying vec2 uv;uniform sampler2D tex;uniform vec2 dir;
void main(){vec2 t=uv*0.5+0.5;vec3 s=vec3(0.0);
  float w[5];w[0]=0.227;w[1]=0.194;w[2]=0.121;w[3]=0.054;w[4]=0.016;
  s+=texture2D(tex,t).rgb*w[0];
  for(int i=1;i<5;i++){s+=texture2D(tex,t+dir*float(i)).rgb*w[i];s+=texture2D(tex,t-dir*float(i)).rgb*w[i];}
  gl_FragColor=vec4(s,1.0);}`;
const compFS=`precision mediump float;varying vec2 uv;uniform sampler2D scene;uniform sampler2D bloom;uniform float strength;uniform float exposure;
void main(){vec2 t=uv*0.5+0.5;vec3 c=texture2D(scene,t).rgb+texture2D(bloom,t).rgb*strength;
  c*=exposure;c=(c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14); // ACES 근사 톤매핑
  c=pow(clamp(c,0.0,1.0),vec3(0.4545));                    // 감마
  gl_FragColor=vec4(c,1.0);}`;
const brightP=prog(copyVS,brightFS),blurP=prog(copyVS,blurFS),compP=prog(copyVS,compFS);
const brA=gl.getAttribLocation(brightP,'p'),blA=gl.getAttribLocation(blurP,'p'),coA=gl.getAttribLocation(compP,'p');
const brU={tex:gl.getUniformLocation(brightP,'tex'),th:gl.getUniformLocation(brightP,'th')};
const blU={tex:gl.getUniformLocation(blurP,'tex'),dir:gl.getUniformLocation(blurP,'dir')};
const coU={scene:gl.getUniformLocation(compP,'scene'),bloom:gl.getUniformLocation(compP,'bloom'),strength:gl.getUniformLocation(compP,'strength'),exposure:gl.getUniformLocation(compP,'exposure')};

/* 렌더 타깃 */
function makeTarget(w,h,depth){
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  let rb=null;if(depth){rb=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
    gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex,fbo,rb,w,h};
}
let sceneT,brightT,blurT,VW=1,VH=1;
function resize(){const r=stage.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,1.75);
  VW=Math.max(2,Math.round(r.width*dpr));VH=Math.max(2,Math.round(r.height*dpr));canvas.width=VW;canvas.height=VH;
  sceneT=makeTarget(VW,VH,true);const hw=Math.max(1,VW>>1),hh=Math.max(1,VH>>1);
  brightT=makeTarget(hw,hh,false);blurT=makeTarget(hw,hh,false);}
addEventListener('resize',resize);resize();
function drawFS(loc){gl.bindBuffer(gl.ARRAY_BUFFER,fsBuf);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);}

/* 행렬 */
function perspective(fovy,a,n,fr){const f=1/Math.tan(fovy/2),nf=1/(n-fr);return[f/a,0,0,0,0,f,0,0,0,0,(fr+n)*nf,-1,0,0,2*fr*n*nf,0];}
function lookAt(e,c,u){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let zl=Math.hypot(z[0],z[1],z[2]);z=[z[0]/zl,z[1]/zl,z[2]/zl];
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];let xl=Math.hypot(x[0],x[1],x[2])||1;x=[x[0]/xl,x[1]/xl,x[2]/xl];
  let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1];}
function mul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}

/* 카메라 */
let yaw=0,pitch=-0.06,fov=68,camZ=0,dragging=false,mx=0,my=0;
stage.addEventListener('pointerdown',e=>{dragging=true;mx=e.clientX;my=e.clientY;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-mx)*0.0035;pitch=clamp(pitch-(e.clientY-my)*0.0035,-1.2,1.2);mx=e.clientX;my=e.clientY;});
stage.addEventListener('pointerup',()=>{dragging=false;stage.classList.remove('drag');});
stage.addEventListener('wheel',e=>{e.preventDefault();fov=clamp(fov+e.deltaY*0.03,34,88);},{passive:false});

/* 차량/보행자 상태 */
const cars=[];
for(let i=0;i<11;i++)cars.push({x:(rng0()<0.5?2.4:4.6),z:rng0()*260,dir:1,spd:rand(9,16)});
for(let i=0;i<11;i++)cars.push({x:-(rng0()<0.5?2.4:4.6),z:rng0()*260,dir:-1,spd:rand(10,18)});
const peds=[];
for(let i=0;i<26;i++)peds.push({x:(rng0()<0.5?1:-1)*rand(roadW+0.6,line-0.4),z:rng0()*260,dir:rng0()<0.5?1:-1,spd:rand(1.1,1.9),ph:rng0()*6.28});
// 라이트 버퍼(넉넉히)
const MAXL=(cars.length*4)+ (signalPts.length*2) + (antennaPts.length*2) + 40;
const litArr=new Float32Array(MAXL*7);
const pedArr=new Float32Array(peds.length*6*5); // 6 vert × (pos3,luv2)

const sun=[0.35,0.16,1.0],fog=[0.24,0.23,0.30];
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
loading.classList.add('hide');

let last=performance.now(),fA=0,fN=0,fr=0,T=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;
  camZ=(camZ+dt*11.0)%L;
  const eye=[Math.sin(T*2.3)*0.06,1.66+Math.sin(T*9.0)*0.03,camZ];
  const cp=Math.cos(pitch),spn=Math.sin(pitch),cyw=Math.cos(yaw),syw=Math.sin(yaw);
  const fwd=[syw*cp,spn,cyw*cp],wUp=[0,1,0];
  let rgt=[fwd[1]*wUp[2]-fwd[2]*wUp[1],fwd[2]*wUp[0]-fwd[0]*wUp[2],fwd[0]*wUp[1]-fwd[1]*wUp[0]];
  let rl=Math.hypot(rgt[0],rgt[1],rgt[2])||1;rgt=[rgt[0]/rl,rgt[1]/rl,rgt[2]/rl];
  let up=[rgt[1]*fwd[2]-rgt[2]*fwd[1],rgt[2]*fwd[0]-rgt[0]*fwd[2],rgt[0]*fwd[1]-rgt[1]*fwd[0]];
  const proj=perspective(fov*Math.PI/180,VW/VH,0.1,400);
  const view=lookAt(eye,[eye[0]+fwd[0],eye[1]+fwd[1],eye[2]+fwd[2]],up);
  const vp=new Float32Array(mul(proj,view));

  // ===== 씬 → sceneT =====
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneT.fbo);gl.viewport(0,0,VW,VH);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  // 하늘
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.useProgram(sky);
  gl.uniform3f(sU.fwd,fwd[0],fwd[1],fwd[2]);gl.uniform3f(sU.rgt,rgt[0],rgt[1],rgt[2]);gl.uniform3f(sU.up,up[0],up[1],up[2]);
  gl.uniform1f(sU.tanH,Math.tan(fov*Math.PI/180*0.5));gl.uniform1f(sU.aspect,VW/VH);gl.uniform3f(sU.sun,sun[0],sun[1],sun[2]);
  drawFS(sA);
  // 도시
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.CULL_FACE);gl.useProgram(city);
  gl.bindBuffer(gl.ARRAY_BUFFER,vbo);const ST=11*4;
  gl.enableVertexAttribArray(cA.pos);gl.vertexAttribPointer(cA.pos,3,gl.FLOAT,false,ST,0);
  gl.enableVertexAttribArray(cA.nor);gl.vertexAttribPointer(cA.nor,3,gl.FLOAT,false,ST,12);
  gl.enableVertexAttribArray(cA.uv);gl.vertexAttribPointer(cA.uv,2,gl.FLOAT,false,ST,24);
  gl.enableVertexAttribArray(cA.seed);gl.vertexAttribPointer(cA.seed,1,gl.FLOAT,false,ST,32);
  gl.enableVertexAttribArray(cA.kind);gl.vertexAttribPointer(cA.kind,1,gl.FLOAT,false,ST,36);
  gl.enableVertexAttribArray(cA.style);gl.vertexAttribPointer(cA.style,1,gl.FLOAT,false,ST,40);
  gl.uniformMatrix4fv(cU.vp,false,vp);gl.uniform3f(cU.cam,eye[0],eye[1],eye[2]);
  gl.uniform3f(cU.fog,fog[0],fog[1],fog[2]);gl.uniform3f(cU.light,sun[0],sun[1],sun[2]);gl.uniform1f(cU.time,T);
  gl.drawArrays(gl.TRIANGLES,0,VCOUNT);
  gl.disableVertexAttribArray(cA.nor);gl.disableVertexAttribArray(cA.uv);gl.disableVertexAttribArray(cA.seed);gl.disableVertexAttribArray(cA.kind);gl.disableVertexAttribArray(cA.style);

  // 보행자(걸음 흔들림)
  let pn=0,po=0;
  for(const p of peds){
    p.z+=p.dir*p.spd*dt;while(p.z-camZ>140)p.z-=180;while(p.z-camZ<-30)p.z+=180;
    const bob=Math.abs(Math.sin(T*p.spd*2.2+p.ph))*0.06;
    const cxp=p.x+Math.sin(T*1.5+p.ph)*0.05, cyp=0.0+bob, czp=p.z;
    const hgt=1.7,wid=0.85;
    const corners=[[-0.5,0],[0.5,0],[0.5,1],[-0.5,0],[0.5,1],[-0.5,1]];
    for(const c of corners){
      const wx=cxp+rgt[0]*c[0]*wid, wy=cyp+up[1]*c[1]*hgt, wz=czp+rgt[2]*c[0]*wid;
      // up는 대략 수직이므로 y=up[1]*c[1]*hgt 근사(+ 카메라 up의 y성분)
      const vy=cyp+ up[1]*c[1]*hgt;
      pedArr[po++]=wx;pedArr[po++]=vy;pedArr[po++]=wz;pedArr[po++]=c[0];pedArr[po++]=c[1];pn++;
    }
  }
  gl.useProgram(pedP);gl.bindBuffer(gl.ARRAY_BUFFER,pedBuf);gl.bufferData(gl.ARRAY_BUFFER,pedArr,gl.DYNAMIC_DRAW);
  const PS=5*4;gl.enableVertexAttribArray(pA.pos);gl.vertexAttribPointer(pA.pos,3,gl.FLOAT,false,PS,0);
  gl.enableVertexAttribArray(pA.luv);gl.vertexAttribPointer(pA.luv,2,gl.FLOAT,false,PS,12);
  gl.uniformMatrix4fv(pU.vp,false,vp);gl.uniform3f(pU.cam,eye[0],eye[1],eye[2]);gl.uniform3f(pU.fog,fog[0],fog[1],fog[2]);
  gl.drawArrays(gl.TRIANGLES,0,pn);
  gl.disableVertexAttribArray(pA.luv);

  // 라이트(가산) : 차량 + 반사, 신호등, 안테나
  let o=0;
  function put(x,y,z,r,g,b,s){litArr[o++]=x;litArr[o++]=y;litArr[o++]=z;litArr[o++]=r;litArr[o++]=g;litArr[o++]=b;litArr[o++]=s;}
  for(const c of cars){
    c.z+=c.dir*c.spd*dt;while(c.z-camZ>140)c.z-=180;while(c.z-camZ<-30)c.z+=180;
    const R=c.dir>0?[1.0,0.10,0.05]:[0.9,0.95,1.0],sz=c.dir>0?820:1150;
    for(const dx of[-0.85,0.85]){put(c.x+dx,0.55,c.z,R[0],R[1],R[2],sz);
      put(c.x+dx,0.06,c.z-c.dir*1.2,R[0]*0.5,R[1]*0.5,R[2]*0.5,sz*1.5);} // 젖은 노면 반사
  }
  // 신호등 사이클
  const cyc=(T*0.4)%3.0; // 0~1 초록,1~1.4 노랑,1.4~ 빨강
  for(const s of signalPts){
    let col;const ph=(cyc+ s.phase*0.13)%3.0;
    if(ph<1.4)col=[0.2,1.0,0.3];else if(ph<1.8)col=[1.0,0.8,0.1];else col=[1.0,0.15,0.1];
    put(s.x,s.y,s.z,col[0],col[1],col[2],900);
    put(s.x,0.06,s.z,col[0]*0.5,col[1]*0.5,col[2]*0.5,1400);
  }
  // 안테나 항공장애등(빨강 점멸)
  const blink=Math.sin(T*3.0)>0.3?1.0:0.15;
  for(const a of antennaPts)put(a[0],a[1],a[2],1.0*blink,0.1*blink,0.08*blink,700);
  const lc=o/7;
  gl.useProgram(litP);gl.bindBuffer(gl.ARRAY_BUFFER,litBuf);gl.bufferData(gl.ARRAY_BUFFER,litArr,gl.DYNAMIC_DRAW);
  const KS=7*4;gl.enableVertexAttribArray(lA.pos);gl.vertexAttribPointer(lA.pos,3,gl.FLOAT,false,KS,0);
  gl.enableVertexAttribArray(lA.col);gl.vertexAttribPointer(lA.col,3,gl.FLOAT,false,KS,12);
  gl.enableVertexAttribArray(lA.size);gl.vertexAttribPointer(lA.size,1,gl.FLOAT,false,KS,24);
  gl.uniformMatrix4fv(lU.vp,false,vp);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);
  gl.drawArrays(gl.POINTS,0,lc);
  gl.depthMask(true);gl.disable(gl.BLEND);gl.disableVertexAttribArray(lA.col);gl.disableVertexAttribArray(lA.size);

  // ===== 블룸 =====
  gl.disable(gl.DEPTH_TEST);
  const hw=VW>>1,hh=VH>>1;
  gl.bindFramebuffer(gl.FRAMEBUFFER,brightT.fbo);gl.viewport(0,0,hw,hh);
  gl.useProgram(brightP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneT.tex);gl.uniform1i(brU.tex,0);gl.uniform1f(brU.th,0.82);drawFS(brA);
  // 블러 H (bright→blur)
  gl.bindFramebuffer(gl.FRAMEBUFFER,blurT.fbo);gl.viewport(0,0,hw,hh);
  gl.useProgram(blurP);gl.bindTexture(gl.TEXTURE_2D,brightT.tex);gl.uniform1i(blU.tex,0);gl.uniform2f(blU.dir,1.4/hw,0);drawFS(blA);
  // 블러 V (blur→bright)
  gl.bindFramebuffer(gl.FRAMEBUFFER,brightT.fbo);gl.viewport(0,0,hw,hh);
  gl.bindTexture(gl.TEXTURE_2D,blurT.tex);gl.uniform2f(blU.dir,0,1.4/hh);drawFS(blA);
  // 합성 → 화면
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,VW,VH);
  gl.useProgram(compP);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneT.tex);gl.uniform1i(coU.scene,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,brightT.tex);gl.uniform1i(coU.bloom,1);
  gl.uniform1f(coU.strength,0.62);gl.uniform1f(coU.exposure,1.02);drawFS(coA);
  gl.activeTexture(gl.TEXTURE0);

  let hd=((yaw*180/Math.PI)%360+360)%360;dirEl.textContent=DIRS[Math.round(hd/45)%8];degEl.textContent=Math.round(hd)+'°';
  fr++;fA+=1/Math.max(dt,1e-4);fN++;if(fr%15===0){fpsEl.textContent=Math.round(fA/fN);fA=0;fN=0;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
