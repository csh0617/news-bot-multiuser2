<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Code Gallery · 6 Algorithms</title>
<style>
  :root{
    --ink:#f3faff;--muted:#8fd8ff;
    --p:#b026ff;--c:#0ff0fc;--k:#ff2e97;--l:#39ff14;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"Pretendard","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
    overflow:hidden;background:#02030a;box-shadow:0 40px 120px rgba(0,0,0,.6)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%,transparent 55%,rgba(0,0,0,.66) 100%)}

  /* 상단 정보 */
  .info{position:absolute;left:clamp(20px,4vw,64px);top:clamp(18px,4vw,56px);pointer-events:none;max-width:60%}
  .idx{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:clamp(10px,1.1vw,15px);
    letter-spacing:.3em;color:var(--c)}
  .idx b{color:var(--ink)}
  h2{margin-top:.25em;font-size:clamp(26px,4.6vw,74px);font-weight:800;letter-spacing:-.02em;line-height:1;
    text-shadow:0 2px 30px rgba(176,38,255,.4)}
  h2 .g{background:linear-gradient(100deg,var(--p),var(--k) 50%,var(--c));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .desc{margin-top:.7em;font-size:clamp(12px,1.5vw,21px);line-height:1.5;color:var(--muted)}
  .tags{margin-top:1em;display:flex;flex-wrap:wrap;gap:.5em}
  .tags b{font-weight:600;font-size:clamp(9px,1vw,13px);color:#d7f4ff;padding:.45em .8em;border-radius:7px;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
  .tags b i{font-style:normal;color:var(--c)}

  /* 하단 네비 */
  .nav{position:absolute;left:0;right:0;bottom:clamp(16px,3vw,40px);display:flex;align-items:center;
    justify-content:center;gap:clamp(10px,1.4vw,20px);z-index:4}
  .dots{display:flex;gap:.6em}
  .dot{width:clamp(7px,.7vw,10px);height:clamp(7px,.7vw,10px);border-radius:50%;
    background:rgba(255,255,255,.22);cursor:pointer;transition:.3s;border:0}
  .dot.on{background:var(--c);box-shadow:0 0 12px var(--c);transform:scale(1.25)}
  .btn{width:clamp(34px,3.4vw,46px);height:clamp(34px,3.4vw,46px);border-radius:50%;cursor:pointer;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--ink);
    font-size:clamp(14px,1.6vw,20px);display:grid;place-items:center;transition:.2s;backdrop-filter:blur(4px)}
  .btn:hover{background:rgba(15,240,252,.15);border-color:var(--c)}
  .hint{position:absolute;right:clamp(18px,3vw,48px);bottom:clamp(18px,3vw,48px);
    font-family:"SF Mono",ui-monospace,monospace;font-size:clamp(9px,1vw,12px);color:var(--muted);
    text-align:right;pointer-events:none;line-height:1.6}
  .hint b{color:var(--c)}
  .fps{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="vignette"></div>

    <div class="info">
      <div class="idx"><b id="num">01</b> / 06 &nbsp;·&nbsp; <span id="algo">FLOW FIELD</span></div>
      <h2 id="title"></h2>
      <div class="desc" id="desc"></div>
      <div class="tags" id="tags"></div>
    </div>

    <div class="hint"><span class="fps" id="fps">60</span> FPS<br>← → <b>넘기기</b> · <b>Space</b> 자동재생</div>

    <div class="nav">
      <button class="btn" id="prev">‹</button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="next">›</button>
    </div>
  </div>
</div>

<script>
(function(){
const stage=document.getElementById('c').parentElement;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const r=stage.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  if(cur) cur.start();
}
addEventListener('resize',()=>resize());

// 공통 유틸
const TAU=Math.PI*2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const NEON=['#b026ff','#0ff0fc','#ff2e97','#39ff14'];
function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function fade(a){ctx.fillStyle=`rgba(2,3,10,${a})`;ctx.fillRect(0,0,W,H);}
function clearHard(){ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);}

/* ---------------- 1. FLOW FIELD ---------------- */
function FlowField(){
  let P=[];const N=900;
  function ang(x,y,t){return (Math.sin(x*0.0016+t*0.3)+Math.cos(y*0.0016+t*0.22)+Math.sin((x+y)*0.0012+t*0.15))*1.6;}
  return {
    title:['벡터장을 ','흐르는 입자'],desc:'노이즈로 만든 각도장을 따라 900개 입자가 강물처럼 흐릅니다.',
    tags:['<i>noise</i> 벡터장','<i>trail</i> 잔상','sin·cos 합성'],
    start(){clearHard();P=[];for(let i=0;i<N;i++)P.push({x:rnd(W),y:rnd(H),c:NEON[i%4]});},
    frame(t,dt){
      fade(0.06);ctx.globalCompositeOperation='lighter';
      for(const p of P){
        const a=ang(p.x,p.y,t);const sp=1.4;
        const nx=p.x+Math.cos(a)*sp, ny=p.y+Math.sin(a)*sp;
        ctx.strokeStyle=p.c;ctx.globalAlpha=.5;ctx.lineWidth=1.1;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke();
        p.x=nx;p.y=ny;
        if(p.x<0||p.x>W||p.y<0||p.y>H){p.x=rnd(W);p.y=rnd(H);}
      }
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }};
}

/* ---------------- 2. BOIDS ---------------- */
function Boids(){
  let B=[];const N=140;
  return {
    title:['무리 짓는 ','인공 생명'],desc:'분리·정렬·응집 세 규칙만으로 새 떼의 군집 비행이 창발합니다.',
    tags:['<i>flocking</i> 창발','vector 물리','separation·align·cohesion'],
    start(){clearHard();B=[];for(let i=0;i<N;i++)B.push({x:rnd(W),y:rnd(H),vx:rnd(-1,1),vy:rnd(-1,1),c:NEON[i%4]});},
    frame(t,dt){
      fade(0.14);
      const R=60,R2=R*R;
      for(const b of B){
        let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,n=0;
        for(const o of B){if(o===b)continue;const dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy;
          if(d2<R2&&d2>0){n++;ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;const d=Math.sqrt(d2);sx-=dx/d;sy-=dy/d;}}
        if(n){ax/=n;ay/=n;cx=cx/n-b.x;cy=cy/n-b.y;
          b.vx+=(ax-b.vx)*0.03+cx*0.0009+sx*0.05;
          b.vy+=(ay-b.vy)*0.03+cy*0.0009+sy*0.05;}
        const sp=Math.hypot(b.vx,b.vy),mx=2.6;if(sp>mx){b.vx=b.vx/sp*mx;b.vy=b.vy/sp*mx;}
        b.x+=b.vx;b.y+=b.vy;
        if(b.x<0)b.x+=W;if(b.x>W)b.x-=W;if(b.y<0)b.y+=H;if(b.y>H)b.y-=H;
        const a=Math.atan2(b.vy,b.vx);
        ctx.fillStyle=b.c;ctx.globalAlpha=.95;
        ctx.beginPath();
        ctx.moveTo(b.x+Math.cos(a)*7,b.y+Math.sin(a)*7);
        ctx.lineTo(b.x+Math.cos(a+2.5)*5,b.y+Math.sin(a+2.5)*5);
        ctx.lineTo(b.x+Math.cos(a-2.5)*5,b.y+Math.sin(a-2.5)*5);
        ctx.closePath();ctx.fill();
      }
      ctx.globalAlpha=1;
    }};
}

/* ---------------- 3. MATRIX RAIN ---------------- */
function Matrix(){
  let cols,drops,fs;const glyph='アイウエオカキクケコサシスセソ0123456789ABCDEF{}[]<>/*+=';
  return {
    title:['쏟아지는 ','디지털 비'],desc:'열마다 문자가 낙하하고, 머리 글자는 하얗게 빛납니다.',
    tags:['<i>column</i> 낙하','랜덤 글리프','head glow'],
    start(){clearHard();fs=Math.max(14,Math.round(W/70));cols=Math.floor(W/fs);
      drops=[];for(let i=0;i<cols;i++)drops[i]=rnd(-40,0);ctx.textBaseline='top';},
    frame(t,dt){
      fade(0.09);ctx.font=`${fs}px "SF Mono",monospace`;
      for(let i=0;i<cols;i++){
        const x=i*fs,y=drops[i]*fs;
        const ch=glyph[(Math.random()*glyph.length)|0];
        ctx.fillStyle=NEON[1];ctx.globalAlpha=.85;ctx.fillText(ch,x,y);
        ctx.fillStyle='#eafffe';ctx.globalAlpha=1;ctx.fillText(ch,x,y-fs); // 밝은 머리
        drops[i]+=0.55;
        if(y>H&&Math.random()>0.975)drops[i]=rnd(-30,0);
      }
      ctx.globalAlpha=1;
    }};
}

/* ---------------- 4. FRACTAL TREE ---------------- */
function Tree(){
  let root;
  function build(depth){
    return {len:rnd(0.68,0.82),ang:rnd(-0.5,0.5),
      kids:depth<=0?[]:[build(depth-1),build(depth-1),(Math.random()<0.35?build(depth-1):null)].filter(Boolean)};
  }
  function draw(node,x,y,dir,len,depth,t){
    const sway=Math.sin(t*1.1+depth*0.5)*0.06*(depth+1);
    const a=dir+node.ang*0.9+sway;
    const nx=x+Math.cos(a)*len, ny=y+Math.sin(a)*len;
    const hue=depth/9;
    const col=depth<2?NEON[3]:depth<4?NEON[1]:NEON[0];
    ctx.strokeStyle=col;ctx.globalAlpha=Math.min(1,.35+depth*0.12);
    ctx.lineWidth=Math.max(0.6,depth*0.9);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();
    if(node.kids.length===0){
      ctx.fillStyle=NEON[2];ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(nx,ny,2.2,0,TAU);ctx.fill();
    }
    for(const k of node.kids)draw(k,nx,ny,a,len*k.len,depth-1,t);
  }
  return {
    title:['자라나는 ','재귀 나무'],desc:'하나의 재귀 함수가 스스로를 불러 가지를 뻗고, 바람에 흔들립니다.',
    tags:['<i>recursion</i> 재귀','L-system 풍','wind sway'],
    start(){clearHard();root=build(9);},
    frame(t,dt){
      fade(0.2);ctx.globalCompositeOperation='lighter';
      draw(root,W/2,H*0.96,-Math.PI/2,Math.min(W,H)*0.18,9,t);
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }};
}

/* ---------------- 5. HARMONOGRAPH ---------------- */
function Harmono(){
  let p,phase,life,ci;
  function newParams(k){
    const f=()=>Math.round(rnd(1,4))+rnd(-0.02,0.02);
    return {a1:rnd(2,3),a2:rnd(2,3),f1:f(),f2:f(),f3:f(),f4:f(),
      p1:rnd(TAU),p2:rnd(TAU),p3:rnd(TAU),p4:rnd(TAU),d:rnd(0.002,0.006)};
  }
  return {
    title:['감쇠하는 ','조화 곡선'],desc:'네 개의 사그라드는 사인파가 서로 얽혀 하모노그래프 궤적을 그립니다.',
    tags:['<i>parametric</i> 곡선','damped sine','Lissajous 계열'],
    start(){clearHard();p=newParams();phase=0;life=0;ci=0;},
    frame(t,dt){
      fade(0.02);ctx.globalCompositeOperation='lighter';
      const cx=W/2,cy=H/2,S=Math.min(W,H)*0.16;
      ctx.strokeStyle=NEON[ci%4];ctx.globalAlpha=.55;ctx.lineWidth=1.2;
      ctx.beginPath();
      const step=0.035, seg=60;
      for(let i=0;i<seg;i++){
        const tt=phase+i*step;const e=Math.exp(-p.d*tt*40);
        const x=cx+S*(p.a1*Math.sin(p.f1*tt+p.p1)+ p.a1*Math.sin(p.f3*tt+p.p3))*0.5*e;
        const y=cy+S*(p.a2*Math.sin(p.f2*tt+p.p2)+ p.a2*Math.sin(p.f4*tt+p.p4))*0.5*e;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
      phase+=step*seg;life+=dt;
      if(life>9){p=newParams();phase=0;life=0;ci++;fade(0.6);}
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }};
}

/* ---------------- 6. GAME OF LIFE ---------------- */
function Life(){
  let cols,rows,cell,grid,age,acc;
  function seed(){grid=new Uint8Array(cols*rows);age=new Float32Array(cols*rows);
    for(let i=0;i<grid.length;i++)grid[i]=Math.random()<0.28?1:0;}
  return {
    title:['살아 숨쉬는 ','생명 격자'],desc:'단 4개의 규칙으로 세포가 태어나고 죽으며 패턴이 진화합니다.',
    tags:['<i>cellular</i> 오토마타','Conway 규칙','age glow'],
    start(){clearHard();cell=Math.max(8,Math.round(W/90));cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);
      acc=0;seed();},
    frame(t,dt){
      acc+=dt;
      if(acc>0.09){
        acc=0;const ng=new Uint8Array(cols*rows);
        for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
          let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;
            const xx=(x+dx+cols)%cols,yy=(y+dy+rows)%rows;n+=grid[yy*cols+xx];}
          const i=y*cols+x;ng[i]=grid[i]?(n===2||n===3?1:0):(n===3?1:0);
          age[i]=ng[i]?Math.min(age[i]+1,20):0;
        }
        grid=ng;
        // 정체 방지: 가끔 소량 리시드
        if(Math.random()<0.02){for(let k=0;k<cols*rows*0.02;k++)grid[(Math.random()*grid.length)|0]=1;}
      }
      clearHard();
      for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
        const i=y*cols+x;if(!grid[i])continue;
        const a=age[i]/20;
        const c=a<0.3?NEON[3]:a<0.7?NEON[1]:NEON[0];
        ctx.fillStyle=c;ctx.globalAlpha=.55+a*0.45;
        const s=cell-1.5;ctx.fillRect(x*cell,y*cell,s,s);
      }
      ctx.globalAlpha=1;
    }};
}

/* ---------------- 덱 제어 ---------------- */
const DEMOS=[FlowField,Boids,Matrix,Tree,Harmono,Life];
const ALGOS=['FLOW FIELD','BOIDS FLOCKING','MATRIX RAIN','FRACTAL TREE','HARMONOGRAPH','GAME OF LIFE'];
let idx=0,cur=null;

const numEl=document.getElementById('num'),algoEl=document.getElementById('algo'),
  titleEl=document.getElementById('title'),descEl=document.getElementById('desc'),
  tagsEl=document.getElementById('tags'),dotsEl=document.getElementById('dots'),
  fpsEl=document.getElementById('fps');

DEMOS.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===0?' on':'');
  b.onclick=()=>go(i);dotsEl.appendChild(b);});

function go(i){
  idx=(i+DEMOS.length)%DEMOS.length;
  cur=DEMOS[idx]();
  cur.start();
  numEl.textContent=String(idx+1).padStart(2,'0');
  algoEl.textContent=ALGOS[idx];
  titleEl.innerHTML=cur.title[0]+'<span class="g">'+cur.title[1]+'</span>';
  descEl.textContent=cur.desc;
  tagsEl.innerHTML=cur.tags.map(t=>'<b>'+t+'</b>').join('');
  [...dotsEl.children].forEach((d,j)=>d.classList.toggle('on',j===idx));
}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(idx+1);
  else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.code==='Space'){e.preventDefault();auto=!auto;autoT=0;}
});

// 자동 재생
let auto=true,autoT=0;
resize();go(0);

let t=0,last=performance.now(),fA=0,fN=0,fr=0;
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;t+=dt;
  if(cur)cur.frame(t,dt);
  if(auto){autoT+=dt;if(autoT>15){autoT=0;go(idx+1);}}
  fA+=1/Math.max(dt,1e-4);fN++;fr++;
  if(fr%15===0){fpsEl.textContent=Math.round(fA/fN);fA=0;fN=0;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
